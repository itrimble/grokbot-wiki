<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1900" viewBox="0 0 2400 1900"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E9A8B"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs><rect width="2400" height="1900" fill="#F4F7FB"/><rect width="2400" height="118" fill="#0F2A44"/><text x="48" y="52" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="800" fill="white">3  •  Bot Operating Model — Lanes, Handoffs &amp; the Atlas Gate</text><text x="48" y="88" font-family="Inter,Arial,sans-serif" font-size="21" fill="#BFD7EA">17 Grok Bots, each with a lane. Atlas is the portfolio gate; Warden owns runtime; Hermes is a coding agent, not a Grok Bot</text><text x="2352" y="52" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="end">REMNANT SECURITY  •  GROK BOT FLEET</text><text x="2352" y="84" font-family="Inter,Arial,sans-serif" font-size="17" fill="#8FB0CC" text-anchor="end">Verified 2026-10-17  •  No IPs / keys shown</text><rect x="920" y="170" width="560" height="260" rx="16" fill="white" stroke="#D7E0EC" stroke-width="1.5"/><rect x="920" y="170" width="560" height="8" rx="4" fill="#0F2A44"/><text x="942" y="212" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#0F2A44">ATLAS — Portfolio Gate</text><text x="942" y="242" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#0F2A44">START HERE — most work passes Atlas first</text><text x="942" y="270" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Gatekeeper: publish / spend / send / ship ONLY</text><text x="942" y="294" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Routine handoffs move file-based, no gate wait</text><text x="942" y="318" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Routes work → Beacon, Scout, Ledger</text><text x="942" y="342" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Receives: meaningful changes, flags,</text><text x="942" y="366" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Friday Amazon, read-only project status</text><rect x="60" y="170" width="700" height="240" rx="16" fill="white" stroke="#D7E0EC" stroke-width="1.5"/><rect x="60" y="170" width="700" height="8" rx="4" fill="#0E9A8B"/><text x="82" y="212" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#0F2A44">SIGNALS IN  (inputs to the gate)</text><text x="82" y="242" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#0E9A8B">Nothing self-promotes to &#x27;shipped&#x27;</text><text x="82" y="270" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  X Bookmarks — app flags → Atlas</text><text x="82" y="294" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Book Growth — Friday Amazon → Atlas</text><text x="82" y="318" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Archivist — meaningful changes → Atlas</text><text x="82" y="342" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Foreman — PROJECTS/ACTIVITY (read-only) → Atlas</text><rect x="1640" y="170" width="700" height="240" rx="16" fill="white" stroke="#D7E0EC" stroke-width="1.5"/><rect x="1640" y="170" width="700" height="8" rx="4" fill="#E11D48"/><text x="1662" y="212" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#0F2A44">RUNTIME &amp; QUALITY  (keep it running)</text><text x="1662" y="242" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#E11D48">Split Oct 10, 2026: runtime ≠ config</text><text x="1662" y="270" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Warden — runtime owner (machines, Hermes, incidents)</text><text x="1662" y="294" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Improve My Bots — config/profiles; symptoms → Warden</text><text x="1662" y="318" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Hermes Tuner — tunes BOX Hermes; incidents ↔ Warden</text><text x="1662" y="342" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Atlas — runtime failures → Warden</text><rect x="60" y="520" width="520" height="340" rx="16" fill="white" stroke="#D7E0EC" stroke-width="1.5"/><rect x="60" y="520" width="520" height="8" rx="4" fill="#2563EB"/><text x="82" y="562" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#0F2A44">BEACON — Sites</text><text x="82" y="592" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#2563EB">LANE</text><text x="82" y="620" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Owns Remnant Security sites</text><text x="82" y="644" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Receives routed work from Atlas</text><text x="82" y="668" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Ships only through the gate</text><text x="82" y="692" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  (site detail: Beacon bot page)</text><rect x="620" y="520" width="520" height="340" rx="16" fill="white" stroke="#D7E0EC" stroke-width="1.5"/><rect x="620" y="520" width="520" height="8" rx="4" fill="#0E9A8B"/><text x="642" y="562" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#0F2A44">SCOUT — Listening</text><text x="642" y="592" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#0E9A8B">LANE</text><text x="642" y="620" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Social / X listening &amp; research</text><text x="642" y="644" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Bulk research → Hermes (CLI)</text><text x="642" y="668" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Success data ↔ Ledger</text><text x="642" y="692" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Warden gates Scout&#x27;s X MCP access</text><rect x="1180" y="520" width="520" height="340" rx="16" fill="white" stroke="#D7E0EC" stroke-width="1.5"/><rect x="1180" y="520" width="520" height="8" rx="4" fill="#D97706"/><text x="1202" y="562" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#0F2A44">LEDGER — Experiments</text><text x="1202" y="592" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#D97706">LANE</text><text x="1202" y="620" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Owns experiment numbers &amp; IDs</text><text x="1202" y="644" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Studio supplies experiment IDs</text><text x="1202" y="668" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Scout success data feeds Ledger</text><text x="1202" y="692" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Owns cost + EXP metrics → weekly dashboard</text><text x="1202" y="716" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  → eval-driven ROUTING.md (EXP-001/003/005/008)</text><rect x="1740" y="520" width="600" height="340" rx="16" fill="white" stroke="#D7E0EC" stroke-width="1.5"/><rect x="1740" y="520" width="600" height="8" rx="4" fill="#7C3AED"/><text x="1762" y="562" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#0F2A44">STUDIO — Content</text><text x="1762" y="592" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#7C3AED">LANE</text><text x="1762" y="620" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Content creation lane</text><text x="1762" y="644" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Supplies experiment IDs → Ledger</text><text x="1762" y="668" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Needs results back to iterate</text><text x="1762" y="692" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  (MBP proposed for video renders)</text><rect x="60" y="960" width="700" height="360" rx="16" fill="white" stroke="#D7E0EC" stroke-width="1.5"/><rect x="60" y="960" width="700" height="8" rx="4" fill="#2563EB"/><g transform="translate(78,982) scale(1.5)"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" fill="#181717"/></g><text x="126" y="1002" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#0F2A44">FOREMAN — Projects</text><text x="82" y="1032" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#2563EB">One project root to rule the fleet</text><text x="82" y="1060" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Single root: AIMacMini:~/projects (canonical)</text><text x="82" y="1084" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Heavy coding → Hermes (not hand-coded by bot)</text><text x="82" y="1108" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  File task cards (queue/) beat summary handoffs</text><text x="82" y="1132" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Reports PROJECTS/ACTIVITY read-only → Atlas</text><text x="82" y="1156" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  NAS mirror is editable, never canonical</text><rect x="820" y="960" width="700" height="360" rx="16" fill="white" stroke="#D7E0EC" stroke-width="1.5"/><rect x="820" y="960" width="700" height="8" rx="4" fill="#7C3AED"/><text x="842" y="1002" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#0F2A44">HERMES — Coding Agent  (NOT a Grok Bot)</text><text x="842" y="1032" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#7C3AED">Execution engine, not a lane owner</text><text x="842" y="1060" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Two installs: Box (cloud-first) + Mini (MiniMax→oMLX)</text><text x="842" y="1084" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Scout bulk research &amp; Foreman heavy coding land here</text><text x="842" y="1108" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Tuned by Hermes Tuner (Box install only)</text><text x="842" y="1132" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  See Diagram 2 for primaries, fallbacks &amp; limits</text><rect x="1580" y="960" width="760" height="360" rx="16" fill="white" stroke="#D7E0EC" stroke-width="1.5"/><rect x="1580" y="960" width="760" height="8" rx="4" fill="#64748B"/><text x="1602" y="1002" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#0F2A44">OTHER LANES  (one-line ownership)</text><text x="1602" y="1032" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#64748B">Full roster: wiki content/bots/*.md</text><text x="1602" y="1060" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Outbound Prospecting — pitches</text><text x="1602" y="1084" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Inbox Cleaner, Life Events, Tax Collector, Dev Diary…</text><text x="1602" y="1108" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  Each bot page in the wiki is its source of truth</text><text x="1602" y="1132" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334155">•  If a handoff is not documented, it does not happen</text><line x1="760" y1="290" x2="920" y2="290" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/><rect x="760.0" y="249" width="160.0" height="32" rx="16" fill="white" stroke="#334155"/><text x="840" y="271" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">flags / reports</text><line x1="1640" y1="290" x2="1480" y2="290" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/><rect x="1503.0" y="249" width="114.0" height="32" rx="16" fill="white" stroke="#334155"/><text x="1560" y="271" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">failures →</text><polyline points="1200,430 1200,480 320,480 320,520" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/><rect x="638.4" y="449" width="123.19999999999999" height="32" rx="16" fill="white" stroke="#334155"/><text x="700" y="471" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">routes work</text><polyline points="1250,430 1250,480 880,480 880,520" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/><polyline points="1300,430 1300,480 1440,480 1440,520" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/><polyline points="1350,430 1350,480 2000,480 2000,520" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/><line x1="470" y1="960" x2="470" y2="860" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/><rect x="472.2" y="894" width="95.6" height="32" rx="16" fill="white" stroke="#334155"/><text x="520" y="916" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">status ↑</text><line x1="760" y1="1140" x2="820" y2="1140" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/><rect x="723.8" y="1099" width="132.39999999999998" height="32" rx="16" fill="white" stroke="#334155"/><text x="790" y="1121" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">heavy coding</text><rect x="60" y="1400" width="720" height="260" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5"/><text x="80" y="1434" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#D97706">⚠  WHY A GATE? (FOR AI-ENTHUSIAST READERS)</text><text x="80" y="1462" font-family="Inter,Arial,sans-serif" font-size="18" fill="#7C2D12">17 autonomous agents without a gate = 17</text><text x="80" y="1485" font-family="Inter,Arial,sans-serif" font-size="18" fill="#7C2D12">invented priorities. Atlas makes shipping a</text><text x="80" y="1508" font-family="Inter,Arial,sans-serif" font-size="18" fill="#7C2D12">decision, not a side-effect of any one bot.</text><text x="80" y="1531" font-family="Inter,Arial,sans-serif" font-size="18" fill="#7C2D12">Read-only reporting (Foreman → Atlas) keeps</text><text x="80" y="1554" font-family="Inter,Arial,sans-serif" font-size="18" fill="#7C2D12">status truthful: reporters cannot edit the plan.</text><rect x="840" y="1400" width="720" height="260" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5"/><text x="860" y="1434" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#D97706">⚠  LANE vs EXECUTION ENGINE</text><text x="860" y="1462" font-family="Inter,Arial,sans-serif" font-size="18" fill="#7C2D12">Bots own outcomes (sites, experiments,</text><text x="860" y="1485" font-family="Inter,Arial,sans-serif" font-size="18" fill="#7C2D12">content). Hermes owns execution (code, bulk</text><text x="860" y="1508" font-family="Inter,Arial,sans-serif" font-size="18" fill="#7C2D12">research) — tuned separately from bot config.</text><text x="860" y="1531" font-family="Inter,Arial,sans-serif" font-size="18" fill="#7C2D12">Confusing the two is how agents silently</text><text x="860" y="1554" font-family="Inter,Arial,sans-serif" font-size="18" fill="#7C2D12">change each other&#x27;s behaviour.</text><rect x="1620" y="1400" width="720" height="260" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5"/><text x="1640" y="1434" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#D97706">⚠  HANDOFFS ARE CONTRACTS</text><text x="1640" y="1462" font-family="Inter,Arial,sans-serif" font-size="18" fill="#7C2D12">Arrows are documented in ARCHITECTURE.md.</text><text x="1640" y="1485" font-family="Inter,Arial,sans-serif" font-size="18" fill="#7C2D12">Undocumented handoffs should be treated as</text><text x="1640" y="1508" font-family="Inter,Arial,sans-serif" font-size="18" fill="#7C2D12">not happening — add them to the wiki first,</text><text x="1640" y="1531" font-family="Inter,Arial,sans-serif" font-size="18" fill="#7C2D12">then to the diagram. Diagram follows docs.</text><text x="60" y="1362" font-family="Inter,Arial" font-size="18" font-weight="800" fill="#0F2A44">LEGEND:</text><rect x="150" y="1348" width="24" height="14" rx="4" fill="#0F2A44"/><text x="180" y="1362" font-family="Inter,Arial" font-size="17" fill="#334155">Gate</text><rect x="306" y="1348" width="24" height="14" rx="4" fill="#0E9A8B"/><text x="336" y="1362" font-family="Inter,Arial" font-size="17" fill="#334155">Signals/Listening</text><rect x="579" y="1348" width="24" height="14" rx="4" fill="#E11D48"/><text x="609" y="1362" font-family="Inter,Arial" font-size="17" fill="#334155">Runtime</text><rect x="762" y="1348" width="24" height="14" rx="4" fill="#7C3AED"/><text x="792" y="1362" font-family="Inter,Arial" font-size="17" fill="#334155">Execution/Content</text><rect x="1035" y="1348" width="24" height="14" rx="4" fill="#D97706"/><text x="1065" y="1362" font-family="Inter,Arial" font-size="17" fill="#334155">Experiments</text><rect x="1254" y="1348" width="24" height="14" rx="4" fill="#2563EB"/><text x="1284" y="1362" font-family="Inter,Arial" font-size="17" fill="#334155">Sites/Projects</text><rect x="60" y="1685" width="2280" height="110" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5"/><text x="80" y="1719" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#D97706">⚠  KNOWN UNVERIFIED — Verified 2026-10-17; items below were NOT live-checked in this audit</text><text x="80" y="1747" font-family="Inter,Arial,sans-serif" font-size="18" fill="#7C2D12">Tailnet ACL details (no ACL file check)  •  Omarchy specs (Ian/Atlas-verified only)</text><text x="80" y="1770" font-family="Inter,Arial,sans-serif" font-size="18" fill="#7C2D12">~17 tok/s + concurrency (unbenchmarked)  •  oMLX login-item status (see Diagram 2)</text><text x="48" y="1845" font-family="Inter,Arial" font-size="16" fill="#64748B">Verified 2026-10-17  •  Sources: wiki content/ARCHITECTURE.md (Bot handoffs + Lanes in one line) + content/bots/*.md  •  Hermes is a CLI coding agent, not a Grok Bot  •  Shepherd retired Oct 10, 2026 per decisions/</text></svg>